[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-local"
description = "Multi-engine local AI CLI and OpenAI-compatible server (ONNX Runtime GenAI on CUDA + Ollama) for Linux and WSL2"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
# ONNX Runtime GenAI with CUDA, plus the user-space CUDA/cuDNN libraries it needs.
cuda = ["onnxruntime-genai-cuda"]
# `prism pull` for Hugging Face ONNX models.
pull = ["huggingface_hub"]
dev = ["pytest"]

[project.scripts]
prism = "prism.cli:main"

[tool.setuptools]
packages = ["prism"]

[tool.setuptools.dynamic]
version = { attr = "prism.__version__" }
