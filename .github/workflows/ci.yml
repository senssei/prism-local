name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            extras: ""
          - python-version: "3.11"
            extras: ""
          - python-version: "3.12"
            extras: "[jinja]"   # the optional Jinja path; the other legs cover Prism without it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, no engines needed)
        run: python -m pip install -e ".${{ matrix.extras }}"
      - name: Byte-compile
        run: python -m compileall -q prism foundry_wsl tests
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the gate diffs against the merge-base with the target branch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Runtime changes need a CHANGELOG.md entry
        run: python scripts/sdlc_check.py --only changelog --base "origin/${{ github.base_ref }}"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and smoke-test the installed CLI outside the checkout
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheel"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/prism" --help
          "$RUNNER_TEMP/venv/bin/prism" doctor
