name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, no engines needed)
        run: python -m pip install -e .
      - name: Byte-compile
        run: python -m compileall -q prism foundry_wsl tests
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and smoke-test the installed CLI outside the checkout
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheel"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/prism" --help
          "$RUNNER_TEMP/venv/bin/prism" doctor
