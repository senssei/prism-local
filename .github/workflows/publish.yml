name: Publish

# Manual release workflow using PyPI "trusted publishing" (OIDC): no API tokens are stored in GitHub.
# Run it from Actions -> Publish -> Run workflow. Publish to TestPyPI first; publish to PyPI only from a
# release tag (vX.Y.Z) that matches prism.__version__.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: version
        run: |
          VERSION=$(python -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("prism/__init__.py").read()).group(1))')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building prism-local $VERSION"
      - name: Require the matching release tag for PyPI
        if: inputs.target == 'pypi'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Publishing to PyPI must run from tag v$VERSION (got $GITHUB_REF_TYPE '$GITHUB_REF_NAME')."
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/prism-local
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install from TestPyPI in a clean virtualenv and smoke-test the CLI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          for attempt in 1 2 3 4 5 6 7 8; do   # the index can take a little while to serve a new upload
            if "$RUNNER_TEMP/venv/bin/pip" install --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ "prism-local==$VERSION"; then break; fi
            echo "not visible yet (attempt $attempt); waiting"; sleep 20
          done
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/prism" --help
          "$RUNNER_TEMP/venv/bin/prism" doctor
          "$RUNNER_TEMP/venv/bin/python" -c "import prism; assert prism.__version__ == '$VERSION', prism.__version__"

  pypi:
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/prism-local
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
